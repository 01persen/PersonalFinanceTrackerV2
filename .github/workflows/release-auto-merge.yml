name: Release auto-merge

on:
  pull_request_target:
    types:
      - labeled
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: startsWith(github.event.pull_request.base.ref, 'release/') && contains(github.event.pull_request.labels.*.name, 'epic-ready')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash --delete-branch
