[project]
name = "pft-api"
version = "0.1.0"
description = "Personal Finance Tracker backend (FastAPI)"
requires-python = ">=3.11,<3.13"
readme = "README.md"
dependencies = [
    "fastapi>=0.135,<0.140",
    "uvicorn[standard]>=0.32,<0.36",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.10,<3",
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.20,<0.1",
    "httpx>=0.27,<0.29",
]

# FastAPI 0.135+ pulls starlette >= 1.0 (the only 0.x-clean line). The
# upper bound "<1" is no longer needed because FastAPI now requires
# starlette >= 1.0 itself. Kept as override only to make the security
# intent explicit.
[tool.uv]
override-dependencies = [
    "starlette>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6,<7",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",              # isort
    "B",              # bugbear
    "UP",             # pyupgrade
    "SIM",            # simplify
    "RUF",            # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: ``Depends(...)`` and ``Path(...)`` in
# argument defaults. B008 flags them but they aren't reassignable, so they're
# safe to whitelist project-wide.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
